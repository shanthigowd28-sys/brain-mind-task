version: 0.2

env:
variables:
AWS_DEFAULT_REGION: ap-south-1
ECR_REPOSITORY_NAME: brain-task
ECR_REPOSITORY_URI: 048069023324.dkr.ecr.ap-south-1.amazonaws.com/brain-task
CLUSTER_NAME: brainmind-cluster

phases:
pre_build:
commands:
- aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin 048069023324.dkr.ecr.ap-south-1.amazonaws.com

build:
commands:
- docker build -t brain-task .
- docker tag brain-task:latest 048069023324.dkr.ecr.ap-south-1.amazonaws.com/brain-task:latest

post_build:
commands:
- docker push 048069023324.dkr.ecr.ap-south-1.amazonaws.com/brain-task:latest

```
  - aws eks update-kubeconfig --region $AWS_DEFAULT_REGION --name $CLUSTER_NAME

  - kubectl apply -f deployment.yaml
  - kubectl apply -f service.yaml

  - kubectl rollout restart deployment/brainmindtask-deployment
```
